# TODO - make configuration in var.yml more dynamic.. break casks and formulae into packages_roles and then use "install_package_roles" as list to just loop through and install all- so it's easier to add new roles instead of touching playbook- updated vars now need to ajust playbook
# TODO - make package_role modify zshrc, aliases and path var according to installed packages (e.g adding k, kx, kn, etc only if kuberenets role was installed)

---
# =============================================================================
# macOS Bootstrap Configuration
# Toggle packages on/off without modifying playbook.yml
# =============================================================================

# --- Feature toggles ---------------------------------------------------------
install_packages: ["developer", "python", "cursor"]
configure_dotfiles: true
base_config_path: "{{ ansible_env.HOME }}/.config"
zsh_config_path: "{{ base_config_path }}/zsh"
overwrite_config_copy: false
backup_config_copy: true
configure_system_defaults: false

# --- Git Configuration ------------------------------------------------------
# Optional: Set these if you want to configure git automatically
# git_user_name: "Your Name"
# git_user_email: "your.email@example.com"
# git_setup_ssh: true  # Set to true to generate SSH keys for git
# git_ssh_key_type: "ed25519"  # or "rsa"
# git_use_ssh: true  # Use SSH for cloning repositories (set to false for HTTPS)

# --- Repository Configuration -----------------------------------------------
# Repository URLs for the split structure
# Update these URLs to match your actual repository locations
dotfiles_repo: "{{ ansible_env.HOME }}/dotfiles"
dotfiles_repo_url: "git@github.com:yourusername/dotfiles.git"  # SSH URL
# dotfiles_repo_url_https: "https://github.com/yourusername/dotfiles.git"  # HTTPS URL (optional)

# Packages repository (if separate from dotfiles)
# Uncomment and configure if you're using a separate packages repository
# packages_repo: "{{ ansible_env.HOME }}/macos-packages"
# packages_repo_url: "git@github.com:yourusername/macos-packages.git"  # SSH URL
# packages_repo_url_https: "https://github.com/yourusername/macos-packages.git"  # HTTPS URL (optional)

# For backward compatibility: use local dotfiles if repositories aren't configured
dotfiles_repo_fallback: "{{ playbook_dir }}/.dotfiles"
    
# --- macOS system defaults (applied when configure_system_defaults is true) ---
system_configurations:
  input_devices:
    # Keyboard repeat rate (lower = faster; default is 6, fast is 2)
    keyboard_key_repeat_rate: 2
    # Initial delay before key repeat starts (lower = shorter delay; default is 25)
    keyboard_delay_until_repeat: 15
    trackpad_enable_tap_click_global: true
    trackpad_enable_tap_click_driver: true
    trackpad_enable_three_finger_drag: true
  finder:
    show_hidden_files: true
    show_file_extensions: true
    default_search_scope: "SCcf"
    show_path_bar: true
  spotlight:
    disable_hotkey: true
  desktop:
    hide_all_items: true
  dock:
    autohide: true
    position: "left"
