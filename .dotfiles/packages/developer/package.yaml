brew:
  formulae:
    - jq
    - yq
  casks:
    - cursor
    - tabby # terminal alternative
    - podman-desktop
    - gh # github cli
shell:
  xcode: xcode-select --install
  
config_links:
  .config/tabby/config.yaml: ~/Library/Application Support/tabby/config.yaml

completions:
  - name: gh
    cmd: "gh completion -s zsh"
  - name: podman
    cmd: podman completion zsh