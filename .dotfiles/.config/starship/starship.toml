# Agnoster-inspired powerline prompt (Solarized Dark palette)
# https://github.com/ohmyzsh/ohmyzsh/blob/master/themes/agnoster.zsh-theme
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](black)\
$username\
[](bg:blue fg:black)\
$directory\
[](bg:green fg:blue)\
$git_branch\
[](fg:green bg:yellow)\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:magenta)\
$conda\
[](fg:magenta bg:black)\
$cmd_duration\
$time\
[ ](fg:black)\
$line_break\
$character"""

palette = 'agnoster'

[os]
disabled = true

[username]
show_always = true
style_user = "bg:black fg:default"
style_root = "bg:black fg:yellow"
format = '[ $user@$hostname ]($style)'

[directory]
style = "bg:blue fg:black"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "\uE0A0"
style = "bg:green"
format = '[[ $symbol$branch ](fg:black bg:green)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:black bg:yellow)]($style)'

[nodejs]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[bun]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[rust]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[golang]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[php]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[kotlin]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[haskell]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:black bg:green)]($style)'

[python]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:black bg:green)]($style)'

[docker_context]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $context) ](fg:black bg:green)]($style)'

[conda]
symbol = " "
style = "fg:black bg:magenta"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:black"
format = '[[  $time ](fg:default bg:black)]($style)'

[line_break]
disabled = true

[character]
disabled = true

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:black"
disabled = false
show_notifications = true
min_time_to_notify = 45000

# Solarized Dark ANSI colors — the palette Agnoster assumes by default.
# Segment mapping mirrors oh-my-zsh agnoster theme variables:
#   context/status → black/default   directory → blue/black
#   git clean      → green/black      git dirty → yellow/black
#   venv/conda     → magenta/black    errors    → red
[palettes.agnoster]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
default = "#839496"
white = "#eee8d5"
orange = "#cb4b16"
violet = "#6c71c4"
